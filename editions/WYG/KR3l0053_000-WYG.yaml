body:
  text: 道山清話小說家𩔖一雜事之屬提要臣等謹案道山清話一卷不著撰人名氏説郛摘其數條刻之題曰宋王暐案書末有暐䟦語云先大父國史在館閣最久多識前輩嘗以聞見著館秘錄曝書記并此書為三仍嵗兵火散失不存近方得此書于南豐曽仲存家因手抄蔵示子孫後題建炎四年庚戌孫朝奉大夫主管亳州明道宫賜紫金魚袋暐書則撰此書者乃暐之祖非暐也周煇清波雜志稱成都富春坊火詩乃洛名徳之後號道山公子者所作亦不言其姓氏書中記元祐五年其父為賀遼國正旦使論范純仁吕公著事歸奏哲宗哲宗命寄書純仁後純仁再相哲宗問曾見李某書否則撰此書者李姓非王姓也然考李燾通鑑長編是年八月庚戌命吏部郎中蘇注户部郎中劉昱為正旦使供備庫使郭宗顔西京左蔵庫副使畢可濟副之後郭宗顔病改遣西頭供奉官閤門陸孝立無李姓者在其間而所稱去年范純仁出守頴昌吕公著卒於位事考二人本傳實均在元祐四年則五年字又不誤不審其何故也或蘓字劉字傳寫訛為李歟所記終於崇寧五年則成書當在徽宗時中頗詆王安石之姦於伊川程子及劉摰亦不甚滿惟記蘓黄晁張交際議論特詳其為蜀黨中人固灼可見矣其書皆記當代雜事王士禎居易錄嘗譏其誤以兩張先為一然作者與張先同時似未可以數百年後之傳聞駁當時之目見疑以傳疑不妨並存其説惟記陳彭年對真宗墨智墨允出春秋少陽事稱上令秘閣取此書既至彭年令於第幾板尋檢果得之云云其説頗誣案春秋少陽篇隋志已不著錄彭年安得見之宋秘閣又何自有之今考皇侃論語疏條其時陸徳明經典釋文邢昺論語疏皆引春秋少陽此條其時尚未有昺疏彭年所舉非陸氏書則皇氏書耳是則傳聞者失實此書因而誤載也乾隆四十六年十月恭校上總纂官臣紀昀臣陸錫熊臣孫士毅總校官臣陸費墀
