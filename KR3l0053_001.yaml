body:
  text: 道山清話宋王暐撰李常為言官言王安石理財不由仁義且言安石遂非喜勝日與其徒吕惠卿等隂籌竊計思以口舌以文厥過以公論同乎流俗以憂國為震驚朕師以百姓愁歎為出自兼并之言以卿士僉議為生乎怨嫉之口而又妄取經據傅㑹其說且言理財用而不由仁與義不上匱則下窮矣臣自知朝夕蒙戮不憚開垂閉之口吐將腐之舌為陛下反覆道之凡數千言上覽之驚歎再三撫諭曰不意班行中乃有卿也從前無臣僚說得如此分明待便為施行明日安石登對神宗正色視安石昨覽李常奏豈不誤他百姓安石垂笏低手作怠慢之狀笑而不對神宗愈怒遂再問之安石略陳數語人不聞安石所言何事但見上連㸃頭曰極是極是常之奏竟不見降出常後對人言不知安石有甚狐媚厭倒之術司馬君實洛中新第初遷入一日步行見墻外暗埋竹簽數十問之則曰此非人行之地將以防盜也公曰吾篋中所有幾何且盜亦人也豈可以此為防命亟去之人之叩齒將以收召神觀辟除外邪其說出於道家者流故修養之人多叩齒不聞以是為恭敬也今人往往入神廟中叩齒非禮也唐明皇名隆基故當時改太一基為棊至今因之不改何也豫嘗兩入文字不報秦觀少游一日寫李太白古風詩三十四首於所居壺𨼆壁間豫因問燕昭延郭隗遂築黃金臺之詩史但言築宫而師事不聞黃金之名太白不知何據少游曰上谷圖經言昭王築臺置千金於其上遂因以為名閲之信然正獻杜公嘗言人家祀祖先非簡慢則媟瀆得其中者鮮矣天聖中詔營浮圖姜遵在永興毁漢唐碑之堅好者以代甎甓當時有一縣尉投書啓具言不可力懇不已至於叩頭流血遵以其故沮格朝命按罷之自是人無敢言者遵因此得進用何斯舉詩云長安古碑用樂石蠆尾銀鈎擅精密缺訛橫道已足哀況復鐫裁代甎甓有如天吳及紫鳳顛倒在衣吁可惜斯舉黃州人少年識蘇子瞻初名頏字頡之後名頡之黃庭堅魯直極推重之嘗與斯舉簡云老病昏塞不記貴字欲奉字曰斯舉取色斯舉矣翔而後集但恐或犯公家諱字爾遵自諫議大夫知永興軍即除樞密副使斯舉又作黃綿襖子歌其序言正月大雨雪十日不已既晴鄰里相呼負日曰黃綿襖子出矣子瞻嘗言韓莊敏對客稱仁宗時一夜三更以來有中使於慈聖殿傳宣慈聖起著背子不開門但於門縫中問云傳宣有甚事中使云皇帝起飲酒盡問皇后殿有酒否慈聖云此中便有酒亦不敢將去夜已深奏知官家且歇息去更不肯開門納中使王陶為中丞劾韓琦曾公亮不押班有背負芒刺之語參政吳奎言不押班蓋已久來相承寖成廢禮非始於二人陶以臺制彈劾舉職便可何至引用背負芒刺跋扈之語且言陶天資險薄市井小人巧詐翻覆情態萬狀邵安簡亢反攻奎言隂陽不利咎由執政奎乃言陶所致所言顛錯奎遂罷魏公一日至諸子讀書堂見卧榻枕邊有一劍公問儀公何用儀公言夜間以備緩急公笑曰使汝果能手刃賊賊死于此汝何以處萬一奪入賊手汝不得為完人矣古人青氊之說汝不記乎何至於是也吾嘗見前輩云夜行切不可以刃物自隨吾輩安能害人徒起惡心非所以自重也神宗時文州曲水縣令宇文之邵上書極言時政且言姦聲亂色盈溢耳目衢巷之中父子兄弟不敢肩隨孰謂王者之都而風俗一至於此神宗乃遣一二內侍於通衢中物色民言竟以無是事而止豫謂縱物色得其言如何敢舉於上前劉貢父常對人言內官如聼得只道是尋常文談魏公在永興一日有一幕官來參公一見熟視蹙然不樂凡數月未嘗交一語儀公乘間問公幕官者公初不識之胡然一見而不樂公曰見其額上有塊𨼆起必是禮拜當非佳士恁地人緩急怎生倚仗哲宗御講筵所手折一柏枝玩程頥為講官奏曰方春萬物發生之時不可非時毁折哲宗亟擲于地終講有不樂之色太后聞之歎曰怪鬼壞事吕晦叔亦不樂其言也云不須得如此溫公在永興一日行國忌香幕次中客將有事欲白公誤觸燭臺倒在公身上公不動亦不問韓持國為人凝嚴方重每兄弟聚話玉汝子華議論風生持國未嘗有一言邵康節與富韓公在洛每日晴必同行至僧舍韓公每過佛寺神祠必鞠躬致敬康節笑曰無乃為佞乎韓公亦笑自是不為也章子厚與蘇子瞻少為莫逆交一日子厚坦腹而卧適子瞻自外來摩其腹以問子瞻曰公道此中何所有子瞻曰都是謀反底家事子厚大笑慶厯中親事官乘醉入禁中上遣內侍諭皇后貴妃使閉閣勿出后聽命不出貴妃乃直趨上前明日上對輔臣泣下樞相乘間啓廢立之議獨梁相適厲聲曰一之為甚其可再乎其事乃止契丹遣使論國書中所稱大宋大契丹以非兄弟之國今輒易曰南朝北朝上詔中書密院共議當時輔臣多言此不計利害不從徒生怨隙梁莊肅曰此易屈爾但答言宋蓋本朝受命之土契丹亦彼國號令無故而自去非佳兆其年賀正使來復稱大契丹如故京城界多火在法放火者一不獲則主吏皆坐罪民有欲中傷官吏者至自爇其所居罷免者紛然時邵安簡為提㸃府界縣鎮寨公事廉得其事乃請自今非延及旁家者雖失捕勿坐自是絶無遺火者遂著為令仁宗時王文正公為諫官因論王德用所進女口上曰正在朕左右文正曰臣之所言正恐在陛下左右上色動呼內侍官使各賜錢三百貫令即今便般出內東門文正謂不須如此之遽但陛下知之足矣上曰人情皆一般若見涕泣不忍去則朕決不能去之既而上即閒說漢唐間事又言太宗黜李績使其子召用大是入思慮來喜見于色忽內侍來奏云已出內東門去訖上復動容乃起其廢郭后也臺臣論列尚美人上曰隨即斥去矣豈容其尚在宫中也上之英斷如此盛矣哉蘇子瞻詩有似聞指麾築上郡已覺談笑無西戎之句嘗問子瞻當是用少陵談笑無西河之語子瞻笑曰故是但少陵亦自用左太冲長嘯激清風志若無東吳也余一日在陕府官次中見一官員與人語話因及守將怒一孔目官始效守將奮髯抵掌厲聲之狀次又作孔目官皇懼鞠躬請罪至於學傳呼杖直之聲一少年方十二三冠帶在衆中坐忽叱曰是何輕薄舉止一坐驚笑後問知是蔡子正家子弟元祐八年吕大防因講筵言及前代宫室多尚華侈本朝宫殿止用赤白前代人君雖在宫禁中亦出輿入輦祖宗皆步自內庭出御後殿止欲涉歷黃庭稍冒寒暑前代多深於用刑大者誅戮小者逺竄唯本朝用法最輕臣下有罪止於罷黜至於虛己納諫不好畋獵不尚玩好不用玉器不貴異味御厨止用羊肉皆祖宗家法陛下不須逺法前代只消盡行家法既而上退至宫中笑謂左右曰吕相公甚次第好微仲為人剛而有守正而不他輔相泰陵八年朝野安靜宣仁聖烈上仙因為山陵使既回乃以大觀文知頴昌時元祐甲戌三月也公既行而左正言上官均言其以張耒秦觀浮薄之徒撰次國史以李之純為中司來之邵楊畏虞策為諫官范祖禹俞執中吕希純吳安詩或主誥命或主封駮皆附會風㫖以濟其欲時監察御史周秩及右正言張商英連上疏交攻之微仲遂落職猶知隨州秩等攻之不已至循州安置未踰嶺而卒人頗寃之程伊川嘗言醫家有四肢不仁之說其言最近理下得仁字極好館中一日會茶有一新進曰退之詩太孟浪時貢父偶在座厲聲問曰風約一池萍誰詩也其人無語蘇子瞻一日在學士院閒坐忽命左右取紙筆寫平疇交逺風良苗亦懷新兩句大書小楷行草書凡寫七八紙擲筆太息曰好好散其紙於左右給事者張文潜嘗言近時印書盛行而鬻書者往往皆士人躬自負儋有一士人盡掊其家所有約百餘千買書將以入京至中塗遇一士人取書目閲之愛其書而貧不能得家有數古銅器將以貨之而鬻書者雅有好古器之癖一見喜甚乃曰毋庸貨也我將與汝估其直而兩易之於是盡以隨行之書換數十銅器亟返其家其妻方訝夫之回疾視其行李但見二三布囊磊磈然鏗鏗有聲問得其實乃詈其夫曰你換得他這箇幾時近得飯喫其人曰他換得我那箇也則幾時近得飯喫因言人之惑也如此坐皆絶倒劉貢父一日問蘇子瞻老身倦馬河堤永踏盡黃榆緑槐影非閣下之詩乎子瞻曰然貢父曰是日影耶月影耶子瞻曰竹影金鎖碎又何嘗說日月也二公大笑常秩之學尤長於春秋或問秩孫復之學何如秩曰此商君法爾步過六尺與棄灰於道者有誅大不近人情矣周重實為察官以民間多壞錢為器物乞行禁止且欲毁棄民間日近所鑄者銅器時張天覺為正言極論其不可恐官司臨迫因而壞及前代古器重實之言既不降出憤悶不平謂同列曰天覺只怕壞了鈸兒磬兒吕晦叔為中丞一日報在假館中諸公因問何事在假時劉貢父在坐忽大言今日必是一箇十齊日蓋指晦叔好佛也洛中有一僧欲開堂說法司馬君實夜過邵堯夫云聞富彥國吕晦叔欲往聽此甚不可但晦叔貪佛已不可勸人亦不怪如何勸得彥國堯夫曰今日已暮矣姑任之明日二人果偕往後月餘彥國招數客共飯堯夫在焉因問彥國曰主上以裴晉公之禮起公公何不應命又聞三遣使公皆卧內見之彥國曰衰病如此其能起否堯夫曰上三命公不起一僧開堂以片紙見呼即出恐亦未是彥國曰弼亦不曾思量至此神宗時韓子華為中丞劾奏宰臣富弼人言張茂先為先帝子而弼引為管軍鄭公丏罷子華亦待罪仍牒閣門更不稱中丞及不朝參今中書密同諫議以為管軍人無間言絳欲以危言中傷大臣事既無根徒搖衆聽兼絳舉措顛倒不足以表率百官於是子華削職知蔡州子方亦請外知荆南敕過門下何郯知封駮事封還子方乃留仁宗時梓州妖人白彥歡能依鬼神作法以詛人至有死者獄上請讞皆以不見傷為疑梁莊肅曰殺人以刃尚或可拒以詛則其可免乎竟殺之張堯佐以溫成之故復除宣徽使唐質肅時為御史裏行爭之不可得求全臺上殿不許求自貶不報於是劾宰相并言事官皆附會緘默乃又援致舊臣帝急召二府以其章示之子方猶立殿上梁莊肅為樞副曰宰相豈御史薦耶叱使下殿殿上莫不驚愕相視於是貶春州别駕又改英州宰相諌官明日亦皆罷逐真宗不豫荆王因問疾留宿禁中宰執亦以祈禳內宿時御藥李從吉因對荆王叱小黃門荆王怒曰皇帝服藥爾輩敢近木圍子髙聲以手中熟水潑之從吉者自言與李文定是族人仁宗既即位從吉使其徒乘間言於上曰頃時先帝大漸八大王留禁中者纍日宰執恐有異謀因八大王取金盂熟水李迪以墨筆攪水中八大王疑有毒藥即時出禁中去上曰不然安有是事若八大王見盂中黑水便不㑹根究翰林司且渲筆在熟水中也則甚計策當時八大王才到禁中便要出去却是娘娘留住教只在禁中明日即去直是無此事必是李從吉唆使爾輩來說上即位未及一年英悟已如此余少時嘗與文潜在館中因看隋唐嘉話見楊祭酒贈項斯詩云度度見詩詩揔好今觀標格勝於詩平生不解藏人善到處逢人說項斯因問諸公唐時未聞項斯有詩名也文潜曰必不足觀楊君詩律已如此想其所好者皆此類也韓莊敏一日來豫子弟讀書堂遍觀子姪程課喜甚謂門客曰舉業只須做到這箇地位有命時儘可及第自此當令日日講五經依次第觀子史程文不必更工枉了工夫若無命時雖工無益東坡在雪堂一日讀杜牧之阿房宫賦凡數遍每讀徹一遍即再三咨嗟歎息至夜分猶不寐有二老兵皆陕人給事左右坐久甚苦之一人長歎操西音曰知他有甚好處夜久寒甚不肯睡連作寃苦聲其一曰也有兩句好西人皆作吼音其人大怒曰你又理會得甚底對曰我愛他道天下人不敢言而敢怒叔黨卧而聞之明日以告東坡大笑曰這漢子也有鍳識秦觀南遷行次郴道遇雨有老僕滕貴者久在少游家隨以南行管押行李在後泥濘不能進少游留道傍人家以俟久之方媻珊策杖而至視少游歎曰學士學士他門取了富貴做了好官不枉了恁地自家做甚來陪奉他門波波地打間官方落得甚聲名怒而不飯少游再三勉之曰沒奈何其人怒猶未已曰可知是沒奈何少游後見鄧博文言之大笑且謂鄧曰到京見諸公不可不舉似以發大笑也子瞻愛杜牧之華清宫詩自言凡為人寫了三四十本矣仁宗時大名府有營兵背生肉蜿蜒如龍時程天球判大名囚其人於獄具奏于朝上覽其奏笑曰是人何罪哉此贅耳即令釋之後其兵輒死上頗疑焉一日對輔臣言大名府兵士肉生于背已是病也又從而禁繫安得不死又其後天球在延州纍立功上欲大用輒曰向來無故囚人至今念之也元符三年立賢妃劉氏為后鄒至完上疏言不當立五伯者三王之罪人也其葵丘之會載書猶首曰無以妾為妻況陛下之聖髙出三王之上其可忽此乎萬一自此以後士大夫有以妾為妻者臣僚紏劾以聞陛下何以處之不治則傷化敗俗無以為國治之則上行下效難以責人先帝在位動以二帝三王為法今陛下為五伯之所不為者哲宗讀至此震怒詔浩言多狂妄事實不根除名勒停新州羈管當時人見至完之貶大峻而未見其疏遂有士人僞為之者不樂至完者録其僞本以進有商王桀紂之語言至完外以此本矯示於人以邀名其實非也上愈怒故行遣至完嘗所往來之人甚衆曾紆云山谷用樂天語作黔南詩白云霜降水返壑風落木歸山冉冉嵗將晏物皆復本原山谷云霜降水返壑風落木歸山冉冉嵗華晚昆蟲皆閉關白云渴人多夢飲饑人多夢飱春來夢何處合眼到東川山谷云病人多夢醫囚人多夢赦如何春來夢合眼在鄉社白云相去六千里地絶天邈然十書九不到何以開憂顔山谷云相望六千里天地隔江山十書九不到何用一開顔紆愛之每對人口誦謂是㸃鐡成金也范寥云寥在宜州嘗問山谷山谷云庭堅少時誦熟久而忘其為何人詩也嘗阻雨衡山尉㕔偶然無事信筆戲書爾寥以紆㸃鐡之語告之山谷大笑曰烏有是理便如此㸃鐡人問邵堯夫人有潔病何也堯夫曰胸中滯礙而多凝耳未有人天生如此也初因多疑積漸而日深此亦未為害但疑心既重則萬境皆錯最是害道第一事不可不知也山谷在宜州服紫霞丹自云得力曽紆嘗以書勸其勿服山谷答云公卷疽根在傍乃不可服如僕服之殆是晴雲之在川谷安得霹靂火也山谷之在宜也其年乙酉即崇寧四年也重九日登郡城之樓聽邉人相語今嵗當鏖戰取封侯因作小詞云諸將說封侯短笛長吹獨倚樓萬事總成風雨去休休戲馬臺南金絡頭催酒莫遲留酒似今秋勝去秋花向老人頭上笑羞羞人不羞花花自羞倚欄髙歌若不能堪者是月三十日果不起范寥自言親見之范寥言山谷在宜州嘗作亥卯未腪肫又作未酉亥腪肫寥皆得享之王沂公每見子姪語話學人鄉音及效人舉止必痛抑之且曰不成登對後亦如此李公擇每飲酒至百杯即止詰旦見賔客或回書問亦不病酒亦無倦色老蘇初出蜀以兵書遍見諸公貴人皆不甚領略後有人言其姓名於富韓公公曰此君専勸人行殺戮以立威豈得直如此要官職做忠宣公范堯夫居常正坐未嘗背靠著物見客處有數胡牀每暑月蒸濕時其餘客所坐者背所著處皆有汗漬㾗迹惟公所坐處常乾也公所著衣服每易以浣濯並無垢膩履襪雖敝亦皆潔白子弟書室中皆坐草縳墩子或杌子初無有靠背之物有一幕客好修飾邉幅其衣巾常整整然公未嘗以目視之每遇筵會公不以上官自居必再三勉客待其飲盡而後已惟勸至此幕客一舉而退然此客不悟每遇赴席愈更潔其服而進豫每舉此以戒吾家子姪王荆公謝公墩詩云千枝孫嶧陽萬本母淇奧滿門陶令株彌岸韓侯􅉡貢父云不成語張天覺好佛而不許諸子誦經云彼讀書未多心源未明才拈著經卷便燒香禮拜不能得了范蜀公鎮每對客尊嚴靜重言有條理客亦不敢慢易惟蘇子瞻則掀髯鼓掌旁若無人然蜀公甚敬之一日有客問公何為不重黃庭堅公曰魯直一代偉人鎮之畏友也安敢不加重又問庭堅學佛有得否公曰這箇則如何知得但佛亦如何恁地學得彭汝礪久在侍從剛明正直朝野推重晚娶宋氏婦有姿色器資承順惟恐不及後出守九江病中忽索紙筆大書云宿世寃家五年夫婦從今以往不打這鼓投筆而逝晏文獻公為京兆辟張先為通判新納侍兒公甚屬意先字子野能為詩詞公雅重之每張來即令侍兒出侑觴往往歌子野所為之詞其後王夫人寖不容公即出之一日子野至公與之飲子野作碧牡丹詞令營妓歌之有云望極藍橋但暮雲千里幾重山幾重水之句公聞之憮然曰人生行樂耳何自苦如此亟命於宅庫支錢若干復取前所出侍兒既來夫人亦不復誰何也陳瑩中云嶺南之人見逐客不問官髙卑皆呼為相公想是見相公常來也一長老在歐陽公座上見公家小兒有小名僧哥者戲謂公曰公不重佛安得此名公笑曰人家小兒要易長者往往以賤名為小名如狗羊犬馬之類是也聞者莫不服公之捷對裕陵嘗因便殿與二三大臣論事已而言曰嘗思唐明皇晚年侈心一搖其為禍有不勝言者本朝無前代離宫别館游豫奢侈非特不為亦不暇為也蓋北有强鄰西有黠羌朝廷汲汲然左枝右梧未嘗一日不念之二敵之勢所以難制者有城國有行國依古以來未有敵國外患如今之强盛者比之漢唐奚啻十倍大臣皆言陛下聖慮及此二敵不足撲滅矣上曰安有撲滅之理但用此以為外懼則可溫公無子又無姬侍裴夫人既亡公常忽忽不樂時至獨樂園於讀書堂危坐終日常作小詩𨽻書梁間云暫來還似客歸去不成家其回人簡有云草妨步則剃之木礙冠則芟之其他任其自然相與同生天地間亦各欲遂其生耳可見公存心也石曼卿一日在李駙馬家見楊大年寫絶句詩一首云折㦸沈沙鐡未消自將磨洗認前朝東風不與周郎便銅雀春深鎖二喬後書義山二字曼卿笑云崑裏沒這般文章塗去義山字書其傍曰牧之蓋兩家集中皆載此詩也此詩佳甚但頗費解說熙寧四年吕誨表乞致仕有曰臣本無宿疾偶值醫者用術乖方不知脉候有虛實隂陽有逆順診察有標本治療有後先妄投湯劑率任情意差之指下禍延四肢寖成風痺遂難行步非徒憚跖盩之苦又將虞心腹之變勢已及此為之奈何雖然一身之微固未足惜無如九族之托良以為憂是思逃祿以偷生不俟引年而還政於戲獻可之論可謂至矣周穜言垂簾時一日早朝執政因理會事太皇太后命一黃門於內中取案上文字來黃門倉卒取至誤觸上幞頭墜地時上未著巾也但見新剃頭撮數小角兒黃門者震懼幾不能立旁有黃門取幞頭以進上凝然端坐亦不怒亦不問既退押班具其事取㫖上曰只是錯太后命押班只是就本班量行遣又言一日輔臣簾前論事甚久上忽顧一小黃門附耳與語小黃門者既去頃之復來亦附耳而奏上忽矍然而興俄聞御屏後小鑼鈸之聲交作須臾即止上復出一小黃門抱上御椅子再端拱而坐直待奏事畢乃退太皇亦顧上笑章子厚為侍從時遇其生朝㑹客其門人林特者亦鄉人也以詩為夀子厚晚於座上取詩以示客且指其頌德處云只是海行言語道人須道著乃為工門人者頗不平之忽曰昔人有令畫工傳神以其不似命别為之既而又以不似凡三四易畫工怒曰若畫得似後是甚模樣滿坐哄然章子厚人言初生時父母欲不舉已納水盆中為人救止其後朝士頗聞其事蘇子瞻嘗與子厚詩有方丈仙人出渺茫髙情猶愛水雲鄉之語子厚謂其譏已也頗不樂熙寧中有薦華山陳戩者博學知治亂大體三十年不出户庭鄰人有不識者云是希夷宗人既對便坐上先覽其所進時議甚喜之至是命坐賜茶戩乃趑趄皇恐謝不敢者再三云上有鴟尾乞陛下暫令除去上使之退左右皆掩笑上亦不怒對輔臣亦未嘗言及一日忽有㫖賜束帛令還山太祖嘗有言不用南人為相實録國史皆載陶穀開基萬年録開寶史譜言之甚詳皆言太祖親寫南人不得坐吾此堂刻石政事堂上或云自王文穆大拜後吏輩故壞壁因移石於他處後寖不知所在既而王安石章惇相繼用事為人竊去如前兩書今館中有其名而亡其書也頃時尚見其他小說往往互見今皆為人節略去人少有知者知亦不敢言矣豫一日道過毗陵舍於張郎中巷見張之第宅雄偉園亭臺榭之勝古木參天因愛而訪之問其世家則知國初時有張佖者隨李煜入朝太宗時佖在史館家常多食客一日上問卿何賔客之多每日聚說何事佖曰臣之親舊多客都下貧乏絶糧臣纍輕而俸有餘故常過臣飯止菜羮而已臣愧菲薄而彼更以為羮美故其來也不得而拒之七日上遣快行家一人伺其食時直入其家佖方對客飯於是即其座上取一客之食以進果止糲飯菜羮仍皆粗璺陶器上喜其不𨼆時號菜羮張家佖三子益之昷之㳫之皆嘗為郎官至今彼人呼其所居曰張郎中巷唐子方為人剛直既參大政與介甫議事每不協嘗與介甫議殺人傷者許首服以律案問免死爭於裕陵之前介甫强辨上主其議子方不勝憤悶對上前謂介甫曰安石行乖學僻其實不曉事今與之造化之柄其誤天下蒼生必矣上以其先朝遺直驟加登用亦不之罪既而子方疽背而死方其病革車駕幸其第以臨問之子方已昏不知人忽聞上至開目而言曰願陛下早覺悟可惜祖宗社稷教安石壞却上首肯之問其家事無一言及薨又幸其第見其畫像不類命取禁中舊藏本以賜其家上有昭陵御題直哉若人為國砥柱八字印以御寶下有昭陵御押字豫嘗親得見焉其家傳有云子方一日見介甫誦華嚴經因勸介甫不若早休官去介甫問之子方曰公之為官止是作業更做執政數年和佛也費力介甫不答一日子方在朝介甫乃以子方之言白於上將以危之上大笑而止紹聖改元九月禁中為宣仁作小祥道場宣隆報長老升座上設御幄於旁以聽其僧祝曰伏願皇帝陛下愛國如身視民如子每念太皇之保佑常如先帝之憂勤庶尹百僚謹守漢家之法度四方萬民永為趙氏之封疆既而有僧問話云太皇今居何處答云身居佛法龍天上心在兒孫社稷中當時傳播人莫不稱歎於戲太皇之聖中外稱為女堯舜方其垂簾每有號令天下人謂之快活條貫元祐癸酉九月一日初夜開寶寺塔表裏通明徹旦禁中夜遣中使賫降御香寺門已閉既開寺僧皆不知也寺中望之無所見去寺漸明後二日宣仁上仙嘗聞祖父言每嵗三月二十八日四方之人集于泰山東嶽祠下謂之朝拜嘉祐八年祖父適以是日至祠下言其日風寒已如深冬時至明日地皆結冰寒甚幾欲裂面墮指人皆閉戶道無行迹日欲入忽聞傳呼之聲自南而北儀衛雄甚近道人家有自户牖潜窺者見馬髙數尺甲士皆不類常人繖扇車乘皆如今乘輿行幸望廟門而入廟之重門皆洞開異香載路有丈夫絳袍幞頭坐黃屋之下亦微聞警蹕之聲亦有言去朝真君回來又有云真君已歸皆相顧合掌中夜方不聞人語又明日天氣復溫皆揮扇而行後數日方聞昭陵其日升遐昭陵上賔前一月每夜太廟中有哭聲不敢奏一日太宗神御前香案自壞杜少陵宿龍門詩有云天闕象緯逼王介甫改闕為閲黃魯直對衆極言其是貢父聞之曰直是怕他劉貢父嘗言人之戲劇極有可人處楊大年與梁周翰朱昂同在禁掖大年年未三十而二公皆髙年矣大年但呼朱翁梁翁每以言侵侮之一日梁戲謂大年曰這老亦待留以與君也朱於後亟搖手曰不要與衆皆笑其捷雖一時戲言而大年不五十而卒今上初登極羣臣班列在庭忽一朝士大叫數聲仆地不知人扶未出殿門氣已絶豫頃時於陜府道間舍於逆旅因步行田間有村學究教授二三小兒閒與之語言皆無倫次忽見案間有小兒書卷其背乃蔡襄寫洛神賦已截為兩假其一塗汙已不可識問其何所自得曰吾家敗籠中物也問更有别紙可見否乃從壁間書夾中取二三十紙大半是襄書簡亦有李西臺川箋所寫詩數紙因以隨行白紙百餘幅易之欣然見授問其家世曰吾家祖亦嘗為大官吾父罷官歸死于此吾時年幼養於近村學究家今從而李姓然吾祖官稱姓名皆不可得而知頃時如此紙甚多皆與小兒作書卷及糊窗用了㑹日已暮乃歸旅舍明日天未明即登塗不及再往至今為恨也先公嘗言頃見李公擇云曾於髙郵道上時正午暑見臨清流有竹籬茅屋望之極雅潔前有修竹長松二道士臨流奕棊於松隂間其一疏髯秀目其一美少年肌體如玉見公擇來皆欣然然與之語則凡俗鄙俚入其茅屋下往往堆積藁秸罌缶之類觀其寢處穢汙如僕厮然忽問豫能飲否豫曰粗能之其少年道士徐起取酒既而酒如米泔月將臭敗於樹間摘小毛桃子數枚置案上豫疑其仙也乃危坐斂袵滿引不敢辭其盛酒物乃一大盆飲於破陶器中徐顧豫僕曰此人亦得乃與之酒一陶器二道士先醉長嘯而入豫愈疑焉既别數里許詢道旁人家曰二人者里胥之子也在城中出家今其父死歸謀還俗而分其家財耳慶厯中胡瑗以白衣召對侍延英講易讀乾元亨利貞不避上御名上與左右皆失色瑗曰臨文不諱後瑗因言孟子民無恆産讀為常上微笑曰又却避此一字蓋自唐穆宗已改常字積久而讀熟雖曰尊經然坐斥君父之名亦未為允上嘗詔其修國史瑗乃避其祖諱不拜舊制講讀官坐而講讀别置書䇿於御案上仁宗忽一日講讀官已班立俟上出久之忽有內侍官自御屏後出大聲曰有聖㫖今後講筵官起立御案前講讀自是遂為定制至神宗朝王安石為侍讀以言道之所存請復賜坐有㫖下禮官議韓維以謂當賜坐劉攽以謂不可紛爭不已議於上前維曰今有時禁中宣長老說法猶升髙踞坐吾儒講聖人大中至正之道乃獨不得坐耶攽曰彼髠徒何知自是朝廷不約束耳維讀聖人書乃亦欲如彼髠無君臣上下乎安石非為道為已重耳於是安石之請不行至元祐初程頥復請坐講太皇缺皇帝幼冲豈可先教改動前人制度有㫖令不得行今皇帝即位之明年范純仁卒其遺表有曰伏願陛下清心寡欲約己便民達孝道於精微攄仁心於廣逺深絶朋黨之論詳察正邪之歸搜抉幽𨼆以盡才人屏斥竒巧以厚風俗愛惜生靈而毋輕議邉事包容狂直而毋易逐言官若宣仁之誣謗未明致保佑之憂勤不顯皆權臣務快其私忿非泰陵實謂之當然以至未究流人之往愆悉以聖恩而特叙尚使存沒猶玷瑕疵又復不解疆場之嚴幾空帑藏之積有城不守得地難耕凡此數端願留聖聽此李之儀端叔之文也上令大書此表留禁中章惇由是再貶雷州司戶端叔後坐黨終身廢棄黃庭堅宜州之貶也坐為承天寺藏記張舜民彬州之貶也坐進兵論世言白骨似山沙似雪之詩此特一事耳兵論近於不遜矣舜民嘗因登對云臣頃赴潭州任因子細奏陳神宗感疾之因哲宗至於失聲而哭元符二年十二月一日水開五丈河數處波浪湧起亦有聲如潮水髙丈餘數日而止富丞相一日於墳寺剃度一僧貢父聞之笑曰彥國壞了幾箇才度得一箇人問之曰彥國每與僧對語往往奬豫過當其人恃此傲慢反以致禍者攽目擊數人矣豈非壞了乎皆大笑然亦莫不以其言為當趙恱道罷政閒居每見僧至接之甚有禮一日一士人以書贄見公讀之終卷正色謂士人曰朝廷有學校有科舉何不勉以卒業却與間退之人說他朝廷利害士人皇恐而退後再往門下人不為通士人謂閽者曰參政便直得如此敬重和尚閽者曰尋常來相見者僧亦只是平平人但相公道只是重他袈裟士人者笑曰我這領白襴直是不直錢財閽者曰也半看佛面士人曰便那輟不得些少來看孔夫子面人傳以為笑元祐五年先公為契丹賀正使遼主問范純仁今在朝否先公曰純仁去年六月以觀文殿學士知穎昌府又問何故教出外先公云純仁病足不能拜暫令𥙷外養病爾又問吕公著如何外𥙷先公云公著去年卒于位初不曾外𥙷乃咨嗟曰朝廷想見闕人先公曰見不住召用舊人先是遼主聞先公言純仁以足疾外𥙷乃回顧近立之人微笑先公既北歸不敢以是載於語録嘗因便殿奏陳上微語曰因通書說與純仁著未幾先公捐舍八年純仁再入相上首以此告之且曰曾令李某通書說純仁曰不曾得書頃時都下有一賣藥老翁自言少時嘗為尚書省中門子門旁有土地廟相傳為大將軍廟靈應如響廟有斷碑題額漢大將軍王公之碑龕在壁間堂後官香燭牲酒無虛日亦霑及閽者每有大除拜必先示朕兆一夜聞羣鬼聚語或哭或笑或曰他運既當限只得此來怎奈何朝廷去裏一曰社稷如此又待如何其一曰改東作西幾時定疊至曉方不聞聲不數日果有拜相者元祐五年文太師自平章軍國重事致政而去初潞公再入劉摰於簾前言王同老所入劄子皆文彥博教之乞行下吏官改正宣仁曰此大不然也吾於此事熟知之矣仁宗時乞立英宗為嗣者文太師也後䇿立英宗者韓相公也功不相掩不須改史宣仁既退歎曰劉左丞幸是好人何故如此摰既相故潞公力求退麻既入御批紙背有云音聲不遐尚有就問之禮几杖以俟竚陪親祀之朝勿以進退之殊云云後學士院入此五句下添而廢謀猷之告潞公年九十二至紹聖五年卒公逮事四朝七換節鉞為侍中司空司徒太保太尉知永興大名秦州者再兩以太師致仕五判河南出將入相者五十餘年可謂功德兼美既而黨論興無所不有矣莘老入相不及一年而罷坐父死不葬後莘老作家廟記自辨劉器之為其集之序建中靖國辛巳都下有一僧行誦法華經晝夜不停聲雖大雨雪亦然行步極緩問之不應招之不來有人隨其後行亦無止宿處每誦數十句即長歎一聲曰怎奈何無人知者元祐丁卯十一月雪中豫過范堯夫於西府先有五客在坐豫既見因衆人論說民間利害公甚喜書室中無火坐久寒甚公命溫酒來公與坐客各舉兩大白公曰說得通透後令人心神融暢或問范景仁何以不信佛景仁曰爾必待我合掌膜拜然後為信耶司馬君實嘗言吕晦叔之信佛近夫佞歐陽永叔之不信近夫躁皆不須如此信與不信才有形迹便不是裕陵嘗問溫公外議說陳升之如何溫公曰二相皆閩人二執政皆楚人風俗如何得近厚又問王安石如何溫公曰天資僻執好勝不曉事其拗强似德州其心術似福州上首肯微笑又嘗稱吕惠卿美才溫公曰惠卿過於安石使江充李訓無才何以動人主司馬君實與吕吉甫在講筵因論變法事至於上前紛拏上曰相與講是非何至乃爾既罷講君實氣貌愈溫粹而吉甫怒氣拂膺移時尚不能言人言一箇陜西人一箇福建子怎生厮合得著趙先生蔡州人後往來無定蘇子由諸公極愛重之嘗言人將發不惟門户有旺相視僕史輩亦可知洛中士大夫家僕史往往皆官樣吾嘗觀主人將興其僕史輩必氣宇軒昂仍忠勤不為過主人將替僕史輩縱不偷錢便一身疙癆周世宗與本朝藝祖方潜龍時識者識其門下人皆是節度使趙先生能使人夢寐中隨其往以觀地獄寶靈長老不信欲往觀之先生與之對趺坐命長老合眼正念人視之二人皆已熟睡鼻息如雷俄頃而覺長老者流汗被體視先生合掌作戰悸之狀人問之皆不答但亟遣人往州橋問銀鋪李貟外如何既而人回曰今早殂矣明日長老遂退院而去京師慈雲有曇玉講師者有道行每為人誦梵網經及講說因緣都人甚信重之病家往往延致一日與趙先生同在王聖美家其僧方講說趙謂僧曰立爾後者何人僧回顧愕然者久之自是僧彌更修謹除齊粥外粒米勺水不入口人有招致聞命即往一錢亦不受熙寧壬子九月華山阜頭嶺崩聲震數十里西嶽祠門户皆震動鐘鼓成聲陷千餘家有大石自立髙四丈周百八十尺今宣德門即正陽門自明道元年十二月改此名今得七十年民間但呼正陽門也明肅既上賔時遺誥以太妃楊氏為皇太后軍國大事內中商量閣門促百官班賀皇后時蔡齊為中丞厲聲叱曰誰命汝來不得追班閣門吏皇懼而退既而執政入奏今皇帝二十四嵗何必更煩太后垂簾豈有女后相繼之理議未定御史龎籍奏言適已將垂簾儀焚了矣敢有異議請取㫖斬于庭左右震栗后自屏後曰此間無固必於是刪去遺誥中內中與皇太后商量一節當時倉卒中實自蔡齊先發之劉貢父言每見介甫道字說便待打諢張文潜言嘗問張安道云司馬君實直言王介甫不曉事是如何安道云賢只消去看字說文潜云字說也只是二三分不合人意思處安道云若然則足下亦有七八分不解事矣文潜大笑大參陳彭年以博學强記受知於定陵凡有問無不知其在北門因便殿賜坐對甚從容上因問墨智墨允是何人彭年曰伯夷叔齊也上問見何書曰春秋少陽即令祕閣取此書既至彭年令於第幾板尋檢果得之上極喜自是注意未幾執政程頥一日在講筵曰聞有㫖召江西僧元某不知何為泰陵曰聞其有禪學故召來欲一見之頥曰臣所講者君臣父子仁義道德性命之說盡在此矣不省陛下以何為禪也上不語頥又曰陛下深居九重之中元某之名如何得達上復不語既罷講頥即移書兩省諫坡謂豈可坐視而不救不惟負兩宫之委任抑且負先帝之厚恩於是頥稱病在假太皇夜遣使至頥家密傳㫖云皇帝既服不是說書且看先朝面明日早參既朝參又明日當講既講畢欲退一中官附耳密奏數語上曰風露早寒可共飲蘇合酒一杯酒未至上曰前日召江西僧何益於治道已令更不施行頥曰人主好佛未有不為國家之害陛下知之社稷幸甚越數日又因講次頥復奏陳曰梁武帝英偉之姿化家為國史稱其生知淳孝篤學勤政誠有之終其身無他過止緣好佛一事家破國亡身自餒死子孫皆為侯景殺戮俱盡可不深戒上曰前日江西召禪僧已曾說與卿更不施行頥曰願陛下取梁武帝紀一看不然臣當托其要而上之上曰想是如此卿必不妄言近時一從官其父本胥也屢典大藩府其治刻木輩極嚴少有過舉即黥配親舊有勉之者則曰吾豈不知但吾為民父母之官豈可見病民者坐視而不治也其為郡所至有聲其父年九十二方卒官封至宣奉大夫張先京師人有文章尤長於詩詞其詩有浮萍斷處見山影小艇歸時聞草聲之句膾䏑人口又有雲破月來花弄影隔墻送過鞦韆影之詞人目為張三影先字子野其祖母宋氏孝章皇后親妹也祖遜因是而貴太宗朝為樞密副使子野生貴家刻苦過於寒儒取髙科甫改秩為鹿邑縣以殂歐陽永叔雅敬重之嘗言與其同飲酒酣衆客或歌或呼起舞子野獨退然其間不動聲氣當時皆稱為長者今人乃以張三影呼之哀哉歐公為其墓銘黃庭堅嘗言人心動則目動王介甫終日目不停轉庭堅一日過范景仁終日相對正身端坐未嘗回顧亦無倦色景仁言吾二十年來胸中未嘗起一思慮二三年來不甚觀書若無賔客則終日獨坐夜分方睡雖兒曹歡呼只尺皆不聞庭堅曰公却是學佛作家公不恱神宗一日在講筵既講罷賜茶甚從容因謂講筵官數日前因見司馬光王昭君古風詩甚佳如宫門銅鐶雙獸面回首何時復來見自嗟不若住巫山布袖蒿簪嫁鄉縣讀之使人愴然時君實病足在假已數日矣吕惠卿曰陛下深居九重之中何從而得此詩上曰亦偶然見之惠卿曰此詩不無深意上曰卿亦嘗見此詩耶惠卿曰未嘗見此詩適但聞陛下舉此四句爾上曰此四句有甚深意往見曾子固家有五代政要一百卷今人家難得之頗恨無筆力傳寫嘗愛世宗自改賜江南書有曰但存帝號何爽嵗寒儻堅事大之心必不迫人於險語意雄偉真得帝王大體蓋是嗣王欲削尊稱求緩師也黃庭堅年五歲已誦五經一日問其師曰人言六經何獨讀其五師曰春秋不足讀庭堅曰於是何言也既曰經矣何得不讀十日成誦無一字或遺其父庶喜其警悟欲令習神童科舉庭堅竊聞之乃笑曰是甚做處庶尤愛重之八嵗時有鄉人欲赴南宫試庶率同舍餞飲皆作詩送行或令庭堅亦賦詩頃刻而成有云君到玉皇香案前若問舊時黃庭堅謫在人間今八年錢穆父嘗言頃在館中有同僚曹姓者本醫家子夤緣入館閣不識字且多犯人錢一日因誦子瞻詩曹矍然曰每見諸公喜此人不知何謂或言其文章之士也曹曰吾近得渠作詩皆重疊用韻全不成語言錢恐人作僞命取以觀之乃子瞻醉中寫少陵八仙歌錢曰此少陵詩子瞻寫耳曹曰便老陵也好喫棒一日諸公過其家觀其所藏書畫其家多資雖真贋相半然尤物甚多有虞世南寫法華經禇河南寫閒居賦臨蘭亭其父得於天上蓋錫賚之物也諸公愛玩不能去手又有閻立本粉畫羅漢橫軸上各有贊字畫皆真楷可喜乃唐時帝王御製不知何帝所作皆有小長印御製之寶兩頭皆尖如橄欖核狀外標首題云應真橫軸曹問坐客何故為應真或對曰真即羅漢也曹曰好好地團甚謎亟命易去自題云十八大阿羅漢或言應真橫軸四字亦是名人書晏臨淄臨川人其未生時有仙人曹八百見其父固謂之曰上界有真人當降汝家自是其家日貧臨淄公既顯其季弟穎自幼亦如臨淄公警悟章聖聞其名召入禁中因令作宫沼瑞蓮賦大見稱賞賜出身授奉禮郎穎聞之走入書室中反關不出其家人輩連呼不應乃破壁而入則已蛻去案上有紙大書小詩二首一云兄也錯到底猶誇將相才世緣何日了了却早歸來一云江外三千里人間十八年此行誰復見一鶴上遼天其年十八嵗也章聖御神仙晏頴四字賜其家李覯字泰伯盱江人賢而有文章蘇子瞻諸公極推重之素不喜佛不喜孟子好飲酒作文古文彌佳一日有達官送酒數斗泰伯家釀亦熟然性介僻不與人往還一士人知其富有酒然無計得飲乃作詩數首罵孟子其一云完廪捐階未可知孟軻深信亦還癡丈人尚自為天子女壻如何弟殺之李見詩大喜留連數日所與談莫非罵孟子也無何酒盡乃辭去既而又有寄酒者士人聞之再往作仁義正論三篇大率皆詆釋氏李覽之笑云公文采甚竒但前次被公喫了酒後極索寞今次不敢相留留此酒以自遣懷聞者莫不絶倒泰伯一日與處士陳烈同赴蔡君謨飯時正春時營妓皆在後圃賣酒相與至筵前聲喏君謨留以佐酒烈已不樂酒行衆妓方歌烈併酒擲於案上作皇懼之狀踰墻攀木而遁時泰伯坐上賦詩云七閩山水掌中窺乘興登臨對落暉誰在畫樓酤酒處幾多鳴櫓送潮歸晴來海色依稀見醉後鄉心積漸微山鳥不知紅粉樂一聲檀板便驚飛既而烈聞之遂投牒云李覯本無士行輒簉賔筵詆釋氏為邪教指孟軻為非聖按吾聖經云非聖人者無法合依名教肆誅市朝君謨覽牒笑謂來者云傳語先生今後不使弟子也君謨後每會客必以示坐上以供一笑云張文潜嘗云子瞻每笑天邉趙盾益可畏水底右軍方熟眠謂湯燖了王羲之也文潜戲謂子瞻公詩有獨看紅蕖傾白墮不知白墮是何物子瞻云劉白墮善釀酒出洛陽伽藍記文潜曰云白墮既是一人莫難為傾否子瞻笑曰魏武短歌行云何以解憂惟有杜康杜康亦是釀酒人名也文潜曰畢竟用得不當子瞻又笑曰公且先去共曹家那漢理會却來此間厮魔蓋文潜時有僕曹某者在家作過亦去失酒器之類既送天府推治其人未招承方文移取㑹也坐皆絶倒劉貢父平生不曾議人長短人有不韙必當面折之雖介甫用事諸公承順不及惟貢父屢當面攻之然退與人言未嘗出一語人皆服其長者雖介甫亦敬服之黃魯直嘗云髙祖紀恐能薄止是才能之能合作奴登切孟堅不必解說彼音奴來切者三足鱉也徐浩詩法士多瓌能却在來字韻押乃是僧似鱉爾豫嘗見蘇子瞻一帖云嵗行盡風雨凄然紙窗竹屋燈青熒熒時於此間得少佳趣無由持獻獨享為愧一日對貢父舉此貢父云前數句是夜行迷路誤入田螺精家中來黃育字和叔魯直叔父也為童兒時其伯氏長善將諸兒出行天驟雨長善問諸兒日在雨落翁婆相撲是何語和叔曰隂陽不和也時年七嵗矣朱康叔送酒與子瞻子瞻以簡謝之云酒甚佳必是故人特遣下㕔也蓋俗謂主者自飲之酒為不出庫范堯夫帥陜府有屬縣知縣因入村至一僧寺少憩既飯步行廊廡間見一僧房頗雅潔闃無人聲案上有酒一瓢知縣者戲書一絶於窗紙云爾非慧逺我非陶何事窗間酒一瓢僧野避人聊自醉卧看風竹影蕭蕭不知其僧俗家先有事在縣理屈坐罪明日其僧乃截取窗字黏於狀前訴于府且曰某有施主某人昨日攜酒至房中值某不在房知縣既至施主走避酒為知縣所飲不辭但有數銀杯知縣既醉不知下落銀杯各有鐫識今施主迫某取之乞追施主某人與㕔吏某人鞠之堯夫曰爾為僧法當飲乎杖而逐之且曰果有失物令主者自來理㑹持其狀以示子姪輩曰爾觀此安得守官處不自重即命火焚之對僚屬中未嘗言及後知縣者聞之乃修書致謝堯夫曰不記有此事自無可謝還其書張子顔少卿晚年嘗目前見白光閃閃然中有白衣人如佛相者子顔信之彌謹乃不食肉不飲酒然體瘠而多病矣時泰陵不豫汪夀卿自蜀入京診御脉聖體極康寧夀卿醫道盛行其門如市子顔一日從夀卿求脉夀卿一見大驚不復言但授以大丸數十小丸千餘粒祝曰十日中服之當盡却以示報既數日視所見白衣人衣變黃而光無所見矣乃欲得肉食又思飲酒又明日俱無所見覺氣體異他日矣乃詣夀卿以告夀卿曰吾固知矣公脾初受病為肺所尅心脾之母也公既多疑心氣一不固自然有所睹吾之大丸實其脾小丸補其心肺為脾之子既不能勝其母其病自當愈也子顔大神之因密問所診御脉如何夀卿曰再得春氣脉當絶雖司命無如之何時元符改元八月也至三年正月泰陵晏駕夀卿後入華山年已八十餘矣昭陵上仙之日金陵城外有人聞數千百人吹簫聲自空中過久之方寂然崇寧改元之明年蔡丞相既遷左揆首令議天下州縣皆建佛剎以崇寧為額時石豫為中丞其門人陳確賢士也夜過豫問豫曰中丞豈可坐視豫曰少待數日看行與不行未幾豫招確謂之曰前夕之言今早已納劄子矣上甚喜乃是乞詔州郡仍置崇寧觀崇寧三年四月大內火宰輔請以司馬光等三百九人姓名大書刻石於文德殿門謂之元祐黨人凡元符三年應詔直言人為邪等附黨籍於刑部云以禳火災其年罷科舉頒三舍法於天下王安石配享文宣王廟庭坐顔孟之下十哲之上駕幸學親行奠謁或謂安石巍然而坐有所未允蔡知院元度曰便塑底也不得四年正月元度引兄嫌以資政知河南府送車塞道凡三日始見絶賓客然後得行禁中給賜之人絡繹於路觀者榮之明年彗星見其辰亘天禁中窗戶洞明與其他處不同連夜詔毁文德殿門石籍宫門方開有㫖取刑部籍入或云亦焚之道山清話
